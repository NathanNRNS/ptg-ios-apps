name: Build & Upload iOS Apps

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Slugs csv, all/batch2/batch3/batch4/unbuilt'
        required: false
        default: 'unbuilt'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build app matrix
        id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.apps || 'unbuilt' }}"
          if [ "$INPUT" = "unbuilt" ]; then
            # Auto-detect: all apps with ascAppId not yet in TestFlight (version in PREPARE_FOR_SUBMISSION)
            # We build all registered apps — the build is idempotent (new version number each time)
            SLUGS=$(python3 -c "
import json
apps = json.load(open('apps.json'))
slugs = [k for k,v in apps.items() if v.get('ascAppId')]
print(json.dumps(slugs))
")
          elif [ "$INPUT" = "all" ]; then
            SLUGS='["reading","bluebook-sat","mensa","cefr","nbt","bartender","ielts","police-officer","ap-us-history","celpip","alcpt","truck-dispatcher","amcat","ibew-aptitude","amc-mcq","bar-exam","ucat","millwright","bls","smart-serve","air-brake"]'
          elif [ "$INPUT" = "batch2" ]; then
            SLUGS='["473-postal-exam","act","ase","boating","canada-citizenship","ccht","cda","chauffeur","clb","cpr","dmv","ekg","epa","esl","f-02","forklift","fsc","g1","hha","hiset","language-proficiency","lpn","mace","moca","nccco","notary-public","nremt","parapro","pca","pert","ptcb","pte","ramsay","rbt","rma","snhd","tabe","toefl","tsi","wonderlic","workkeys"]'
          elif [ "$INPUT" = "batch3" ]; then
            SLUGS='["aat-level-4-professional","aca-icaew-qualification","amc-clinical-examination","asvab","azure-ai-900","bafa-animateur-france","bhv-examen-netherlands","boat-licence-nsw","cambridge-fce-b2-first","cbr-theorie-examen-motor-netherlands","cdl","cilex-level-3","cna","confined-space-australia","cpre-certified-park-and-recreation-executive","ged","nclex","sat","servsafe","teas"]'
          elif [ "$INPUT" = "batch4" ]; then
            SLUGS='["crni-exam","dkt-nsw","dkt-vic","dogging-licence-australia","dp-600-fabric-analytics-engineer","dp-900-azure-data-fundamentals","ehbo-examen-netherlands","ewp-elevated-work-platform-australia","food-safety-supervisor-australia","hcpc-registration","isc2-cc-cybersecurity","mir-medico-residente-spain","mjdf-part-1","naplan-australia","oscp-offensive-security","parcc","part-p-electrical","permis-conduire-wallonie-belgium"]'
          else
            SLUGS=$(echo "$INPUT" | python3 -c "import sys,json; s=sys.stdin.read().strip(); print(json.dumps([x.strip() for x in s.split(',')]))")
          fi
          echo "matrix={\"slug\":$SLUGS}" >> $GITHUB_OUTPUT
          echo "Building: $SLUGS"

  build:
    needs: prepare
    runs-on: macos-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 10
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications/ | grep -E '^Xcode' | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Customize app config
        run: node scripts/customize.js ${{ matrix.slug }}

      - name: Add iOS platform
        run: |
          npx cap add ios 2>/dev/null || true
          npx cap sync ios

      - name: Generate icons (Python — reliable replacement for @capacitor/assets)
        run: |
          mkdir -p resources
          cp icons/${{ matrix.slug }}.png resources/icon.png
          python3 scripts/generate-icons.py resources/icon.png

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Fastlane
        run: bundle install --jobs 4 --retry 3

      - name: Get app metadata from apps.json
        id: app-meta
        run: |
          BUNDLE_ID=$(node -e "const a=require('./apps.json'); const s='${{ matrix.slug }}'; const app=a[s]; console.log(app.ascBundleId || app.bundleId || 'com.practicetestgeeks.'+s.replace(/-/g,''))")
          ASC_APP_ID=$(node -e "const a=require('./apps.json'); console.log(a['${{ matrix.slug }}'].ascAppId || '')")
          echo "bundle_id=$BUNDLE_ID" >> $GITHUB_OUTPUT
          echo "asc_app_id=$ASC_APP_ID" >> $GITHUB_OUTPUT

      - name: Clean up stale Development certificates
        run: python3 scripts/cleanup-dev-certs.py
        continue-on-error: true
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

      - name: Build & upload to TestFlight
        run: bundle exec fastlane release
        env:
          APP_SLUG:        ${{ matrix.slug }}
          BUNDLE_ID:       ${{ steps.app-meta.outputs.bundle_id }}
          ASC_APP_ID:      ${{ steps.app-meta.outputs.asc_app_id }}
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TEAM_ID:         ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload IPA as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-ipa
          path: build/*.ipa
          retention-days: 7

  # After all builds complete: upload metadata + submit for review automatically
  post-build:
    needs: build
    runs-on: ubuntu-latest
    if: always()  # run even if some builds failed
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cryptography pillow

      - name: Upload metadata for all registered apps
        run: python3 scripts/upload-metadata.py --all
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

      - name: Submit all eligible apps for App Store review
        run: python3 scripts/submit-for-review.py --all
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
