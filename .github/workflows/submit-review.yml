name: Submit Apps for App Store Review

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated slugs, "all", or "new-only"'
        required: true
        default: 'new-only'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cryptography

      - name: Submit for review
        run: |
          INPUT="${{ github.event.inputs.apps }}"
          if [ "$INPUT" = "all" ]; then
            python3 scripts/submit-for-review.py --all
          elif [ "$INPUT" = "new-only" ]; then
            python3 scripts/submit-for-review.py --new-only
          else
            python3 scripts/submit-for-review.py $(echo "$INPUT" | tr ',' ' ')
          fi
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
