<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>APP_NAME_PLACEHOLDER</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; overflow: hidden; }

    /* Loading screen */
    #loading {
      position: fixed; inset: 0; background: #1a73e8;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; transition: opacity 0.3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading-logo { width: 80px; height: 80px; border-radius: 20px; background: white; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; }
    #loading-logo svg { width: 50px; height: 50px; }
    #loading-text { color: white; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    #loading-sub { color: rgba(255,255,255,0.7); font-size: 14px; }
    #loading-spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 30px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Offline screen */
    #offline {
      position: fixed; inset: 0; background: #f8f9fa;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 99; padding: 40px;
    }
    #offline.show { display: flex; }
    #offline svg { width: 80px; height: 80px; color: #ccc; margin-bottom: 20px; }
    #offline h2 { font-size: 22px; color: #333; margin-bottom: 10px; }
    #offline p { color: #666; text-align: center; margin-bottom: 30px; line-height: 1.5; }
    #retry-btn {
      background: #1a73e8; color: white; border: none; padding: 14px 32px;
      border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: 600;
    }

    /* Tab bar */
    #tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff; border-top: 1px solid #e0e0e0;
      display: flex; padding-bottom: env(safe-area-inset-bottom);
      z-index: 50;
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 8px 0; cursor: pointer; color: #999; transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active { color: #1a73e8; }
    .tab svg { width: 24px; height: 24px; }
    .tab span { font-size: 10px; margin-top: 3px; font-weight: 500; }

    /* Main WebView iframe */
    #webview-frame {
      position: fixed; top: 0; left: 0; right: 0;
      bottom: 49px; /* tab bar height */
      border: none; width: 100%; height: calc(100% - 49px);
    }
  </style>
</head>
<body>

  <!-- Loading splash -->
  <div id="loading">
    <div id="loading-logo">
      <svg viewBox="0 0 50 50" fill="none">
        <rect width="50" height="50" rx="12" fill="#1a73e8"/>
        <text x="25" y="35" text-anchor="middle" font-size="28" font-weight="bold" fill="white">P</text>
      </svg>
    </div>
    <div id="loading-text">APP_NAME_PLACEHOLDER</div>
    <div id="loading-sub">Free Practice Tests</div>
    <div id="loading-spinner"></div>
  </div>

  <!-- Offline screen -->
  <div id="offline">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M18.364 5.636a9 9 0 010 12.728M15.536 8.464a5 5 0 010 7.072M12 11l1 5M3 3l18 18M6.343 17.657A9 9 0 015.636 5.636"/>
    </svg>
    <h2>No Internet Connection</h2>
    <p>Please check your connection and try again to access your practice tests.</p>
    <button id="retry-btn" onclick="retryConnection()">Try Again</button>
  </div>

  <!-- Native tab bar -->
  <div id="tab-bar">
    <div class="tab active" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </div>
    <div class="tab" onclick="switchTab('tests')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9m-12 12H5a2 2 0 01-2-2V9m0 0h18"/></svg>
      <span>Tests</span>
    </div>
    <div class="tab" onclick="switchTab('progress')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span>Progress</span>
    </div>
    <div class="tab" onclick="switchTab('settings')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span>Settings</span>
    </div>
  </div>

  <!-- Main content iframe -->
  <iframe id="webview-frame" src="WEBVIEW_URL_PLACEHOLDER" allowfullscreen></iframe>

  <script>
    const WEBVIEW_URL = 'WEBVIEW_URL_PLACEHOLDER';
    const frame = document.getElementById('webview-frame');
    let isOnline = navigator.onLine;
    let currentTab = 'home';

    // Tab URLs
    const tabUrls = {
      home: WEBVIEW_URL,
      tests: WEBVIEW_URL + '#tests',
      progress: WEBVIEW_URL + '#progress',
      settings: WEBVIEW_URL + '#settings'
    };

    // Hide loading when iframe loads
    frame.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
      }, 800);
    });

    // Network detection
    function updateOnlineStatus() {
      isOnline = navigator.onLine;
      const offlineEl = document.getElementById('offline');
      if (!isOnline) {
        offlineEl.classList.add('show');
      } else {
        offlineEl.classList.remove('show');
        frame.src = frame.src; // reload
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    function retryConnection() {
      if (navigator.onLine) {
        document.getElementById('offline').classList.remove('show');
        frame.src = frame.src;
      }
    }

    // Tab switching
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['home','tests','progress','settings'][i] === tab);
      });

      if (tab === 'settings') {
        showSettings();
        return;
      }

      frame.style.display = 'block';
      document.getElementById('settings-panel')?.remove();
      frame.src = tabUrls[tab] || WEBVIEW_URL;
    }

    // Native settings screen
    function showSettings() {
      frame.style.display = 'none';
      const existing = document.getElementById('settings-panel');
      if (existing) existing.remove();

      const panel = document.createElement('div');
      panel.id = 'settings-panel';
      panel.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:49px;background:#f2f2f7;overflow-y:auto;padding:20px 0;';
      panel.innerHTML = `
        <div style="padding:16px 20px 8px;font-size:13px;color:#6b6b6b;text-transform:uppercase;letter-spacing:.5px">General</div>
        <div style="background:white;border-radius:12px;margin:0 16px;overflow:hidden">
          <div style="padding:16px;border-bottom:1px solid #f2f2f7;display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:16px;color:#000">Push Notifications</div>
              <div style="font-size:13px;color:#6b6b6b;margin-top:2px">Study reminders & new tests</div>
            </div>
            <label style="position:relative;display:inline-block;width:51px;height:31px">
              <input type="checkbox" id="notif-toggle" style="opacity:0;width:0;height:0" onchange="toggleNotifications(this.checked)">
              <span id="notif-slider" style="position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:31px;transition:.3s"></span>
            </label>
          </div>
          <div style="padding:16px;display:flex;justify-content:space-between;align-items:center" onclick="clearCache()">
            <div style="font-size:16px;color:#000">Clear Cache</div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>

        <div style="padding:16px 20px 8px;font-size:13px;color:#6b6b6b;text-transform:uppercase;letter-spacing:.5px">About</div>
        <div style="background:white;border-radius:12px;margin:0 16px;overflow:hidden">
          <div style="padding:16px;border-bottom:1px solid #f2f2f7;display:flex;justify-content:space-between">
            <div style="font-size:16px">Version</div>
            <div style="color:#6b6b6b">1.0.0</div>
          </div>
          <div style="padding:16px;border-bottom:1px solid #f2f2f7" onclick="openUrl('https://practicetestgeeks.com/privacy/')">
            <div style="font-size:16px;color:#000">Privacy Policy</div>
          </div>
          <div style="padding:16px" onclick="rateApp()">
            <div style="font-size:16px;color:#1a73e8">Rate This App ⭐</div>
          </div>
        </div>

        <div style="text-align:center;padding:30px 20px;color:#6b6b6b;font-size:13px">
          PracticeTestGeeks.com<br>Free Practice Tests
        </div>
      `;
      document.body.insertBefore(panel, document.getElementById('tab-bar'));

      // Update slider visual
      const slider = document.getElementById('notif-slider');
      const toggle = document.getElementById('notif-toggle');
      const notifEnabled = localStorage.getItem('notif') !== 'false';
      toggle.checked = notifEnabled;
      slider.style.background = notifEnabled ? '#34c759' : '#ccc';
      if (notifEnabled) { slider.style.background = '#34c759'; const knob = document.createElement('span'); knob.style.cssText='position:absolute;top:2px;left:22px;width:27px;height:27px;background:white;border-radius:50%;transition:.3s;box-shadow:0 2px 4px rgba(0,0,0,.3)'; slider.appendChild(knob); }
    }

    function toggleNotifications(enabled) {
      localStorage.setItem('notif', enabled);
      document.getElementById('notif-slider').style.background = enabled ? '#34c759' : '#ccc';
      if (window.Capacitor) {
        if (enabled) {
          import('./capacitor-push.js').catch(()=>{});
        }
      }
    }

    function clearCache() {
      if (confirm('Clear all cached data?')) {
        caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        localStorage.clear();
        alert('Cache cleared');
      }
    }

    function rateApp() {
      if (window.Capacitor) {
        window.location.href = 'itms-apps://itunes.apple.com/app/idAPP_ID_PLACEHOLDER?action=write-review';
      }
    }

    function openUrl(url) {
      window.open(url, '_blank');
    }

    // Capacitor push notifications setup
    document.addEventListener('deviceready', async () => {
      if (window.Capacitor) {
        try {
          const { PushNotifications } = await import('@capacitor/push-notifications');
          await PushNotifications.requestPermissions();
          await PushNotifications.register();
        } catch(e) {}
      }
    });
  </script>
</body>
</html>
